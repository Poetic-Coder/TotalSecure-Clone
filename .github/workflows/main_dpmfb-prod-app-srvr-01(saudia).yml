# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - dpmfb-prod-app-srvr-01

on:
  push:
    branches:
      - server
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Yarn install
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: true
        run: |
          # Remove frozen-lockfile for initial install
          timeout 360 bash -c "yarn install --ignore-scripts" || echo '⚠️ Build timed out but workflow succeeded'
          # If successful, verify with frozen lockfile
          if [ $? -eq 0 ]; then
            yarn install --frozen-lockfile --ignore-scripts
          fi
          
      - name: Handle native modules
        run: |
          # Check if bcrypt exists before trying to build
          if [ -d "node_modules/bcrypt" ]; then
            cd node_modules/bcrypt
            npx node-pre-gyp install --Fallback-to-build || echo "⚠️ node-pre-gyp failed, continuing"
            cd ../..
          fi

      - name: Generate and apply Prisma migrations
        env:
           DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma generate
          yarn run build
          npx prisma migrate deploy

      - name: Yarn build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          yarn run build

      - name: Archive Prisma binaries for Azure
        run: |
          tar -czf prisma_bin_only.tar.gz -C node_modules .bin .prisma
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dpmfb-prod-app-srvr-01'
          slot-name: 'saudia'
          package: .

          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D21BABCC28C345F484B28200B6418B14 }}

